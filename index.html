<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    <title>Academia FitLife</title>
</head>
<body>

    <h1>Academia FitLife 💪</h1>
    <h2>Faça sua pré-matrícula!</h2>
    <p>Comece hoje a cuidar da sua saúde.</p>

    <form action="https://formspree.io/f/xkjoogdj" method="POST">

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" placeholder="Sua idade" required>

        <label for="objetivo">Objetivo:</label>
        <select id="objetivo" name="objetivo" required>
            <option value="">Escolha seu objetivo</option>
            <option value="Emagrecer">Emagrecer</option>
            <option value="Ganhar massa muscular">Ganhar massa muscular</option>
            <option value="Condicionamento físico">Condicionamento físico</option>
        </select>

        <button type="submit">Fazer pré-matrícula</button>

    </form>

</body>
</html>
